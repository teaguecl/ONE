# one-debugger configuration -- Borland colors (one-debugger --write-config FILE --theme borland)
#
# One setting per line: key = value.  A line starting with '#', or ' # ' after a value, is a comment.
# The debugger reads --config FILE, or else ./one-debugger.cfg, or else ~/.config/one/debugger.cfg
# ($XDG_CONFIG_HOME/one/debugger.cfg).  Settings that are left out come from the built-in theme:
# softice (the default), or borland with --theme borland.
#
# Colors: 'foreground on background', optionally followed by bold, italic and/or underline.
#   Color names: black blue green cyan red magenta brown lightgray
#                darkgray lightblue lightgreen lightcyan lightred lightmagenta yellow white
#                darkcyan (#008B8B)
#   (the VGA text-mode colors: black = #000000, blue = #0000AA, lightgray = #AAAAAA ..., the same in
#   every terminal), or #RRGGBB, or 'default' (the terminal's own color).  A terminal without 24-bit
#   color shows the nearest color it has.  A BIOS attribute byte (0x1F = white on blue) works too.

theme = borland                                     # built-in colors for anything not set below

# --- windows ---
shadows = off                                       # drop shadows under the windows (on/off)

# --- colors of the debugger windows ---
color.text = lightgray on blue                      # normal text in all windows
color.value = white on blue                         # register values, mnemonics, commands echoed in the command window
color.changed = yellow on blue                      # values that changed since the last stop
color.register_changed = yellow on blue             # registers and flags that changed (all of PC=1234)
color.label = lightcyan on blue                     # labels and instruction comments
color.dim = cyan on blue                            # addresses, register names, instruction bytes, clear flags
color.current_line = black on cyan                  # code window: the instruction at PC
color.breakpoint_line = white on red                # code window: an instruction with a breakpoint
color.current_breakpoint_line = yellow on red       # code window: the instruction at PC, on a breakpoint
color.cursor_line = blue on lightgray               # code window: the cursor line (when the window has the focus)
color.cursor_breakpoint_line = red on lightgray     # code window: the cursor line, on a breakpoint
color.running = yellow on blue                      # command window: the 'Running...' line

# --- desktop, window frames, menu bar and status line ---
color.desktop = blue on lightgray                   # desktop background
color.frame_active = white on blue                  # frame and title of the active window
color.frame_inactive = lightgray on blue            # frame and title of the other windows
color.frame_icons = lightgreen on blue              # close/zoom icons of the active window
color.menu = black on lightgray                     # menu bar, menus and status line
color.menu_disabled = darkgray on lightgray         # disabled menu items
color.menu_shortcut = red on lightgray              # highlighted letters and keys in menus and the status line
color.menu_selected = black on green                # selected menu item
color.menu_selected_disabled = darkgray on green    # selected disabled menu item
color.menu_selected_shortcut = red on green         # highlighted letter of the selected menu item
