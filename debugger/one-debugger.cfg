# one-debugger configuration -- SoftICE colors (one-debugger --write-config FILE --theme softice)
#
# One setting per line: key = value.  A line starting with '#', or ' # ' after a value, is a comment.
# The debugger reads --config FILE, or else ./one-debugger.cfg, or else ~/.config/one/debugger.cfg
# ($XDG_CONFIG_HOME/one/debugger.cfg).  Settings that are left out come from the built-in theme:
# softice (the default), or borland with --theme borland.
#
# Colors: 'foreground on background', optionally followed by bold, italic and/or underline.
#   Color names: black blue green cyan red magenta brown lightgray
#                darkgray lightblue lightgreen lightcyan lightred lightmagenta yellow white
#                darkcyan (#008B8B)
#   (the VGA text-mode colors: black = #000000, blue = #0000AA, lightgray = #AAAAAA ..., the same in
#   every terminal), or #RRGGBB, or 'default' (the terminal's own color).  A terminal without 24-bit
#   color shows the nearest color it has.  A BIOS attribute byte (0x1F = white on blue) works too.

theme = softice                                     # built-in colors for anything not set below

# --- windows ---
shadows = off                                       # drop shadows under the windows (on/off)

# --- colors of the debugger windows ---
color.text = lightgray on black                     # normal text in all windows
color.value = lightgray on black                    # register values, mnemonics, commands echoed in the command window
color.changed = white on black                      # values that changed since the last stop
color.register_changed = cyan on black              # registers and flags that changed (all of PC=1234)
color.label = white on black                        # labels and instruction comments
color.dim = lightgray on black                      # addresses, register names, instruction bytes, clear flags
color.current_line = blue on lightgray              # code window: the instruction at PC
color.breakpoint_line = white on black              # code window: an instruction with a breakpoint
color.current_breakpoint_line = black on lightgray  # code window: the instruction at PC, on a breakpoint
color.cursor_line = black on cyan                   # code window: the cursor line (when the window has the focus)
color.cursor_breakpoint_line = white on darkcyan    # code window: the cursor line, on a breakpoint
color.running = white on black                      # command window: the 'Running...' line

# --- desktop, window frames, menu bar and status line ---
color.desktop = black on black                      # desktop background
color.frame_active = lightgreen on black            # frame and title of the active window
color.frame_inactive = green on black               # frame and title of the other windows
color.frame_icons = lightgreen on black             # close/zoom icons of the active window
color.menu = black on cyan                          # menu bar, menus and status line
color.menu_disabled = darkgray on cyan              # disabled menu items
color.menu_shortcut = white on cyan                 # highlighted letters and keys in menus and the status line
color.menu_selected = white on black                # selected menu item
color.menu_selected_disabled = darkgray on black    # selected disabled menu item
color.menu_selected_shortcut = lightgreen on black  # highlighted letter of the selected menu item
