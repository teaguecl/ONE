    BANK0:    load = B0,  type = ro;
    BANK1:    load = B1,  type = ro;
    BANK2:    load = B2,  type = ro;
    BANK3:    load = B3,  type = ro;
    BANK4:    load = B4,  type = ro;
    BANK5:    load = B5,  type = ro;
    BANK6:    load = B6,  type = ro;
    FIXED:    load = B7,  type = ro;
    VECTORS:  load = B7,  type = ro, start = $FFFA;
    CHR:      load = CHR, type = ro;
}
