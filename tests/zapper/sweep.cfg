MEMORY {
    HDR: start = $0000, size = $0010, fill = yes, file = %O;
    ZP:  start = $0000, size = $0100, type = rw, file = "";
    RAM: start = $0200, size = $0500, type = rw, file = "";
    OAMR: start = $0700, size = $0100, type = rw, file = "";
    PRG: start = $8000, size = $8000, fill = yes, file = %O;
    CHR: start = $0000, size = $2000, fill = yes, file = %O;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    OAM:      load = OAMR, type = bss;
    CODE:     load = PRG, type = ro, start = $8000;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHR:      load = CHR, type = ro;
}
