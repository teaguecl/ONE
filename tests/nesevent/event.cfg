MEMORY {
    HDR:   start = $0000, size = $0010,  fill = yes, file = %O;
    ZP:    start = $0000, size = $0100,  type = rw, file = "";
    RAM:   start = $0200, size = $0100,  type = rw, file = "";
    B0:    start = $8000, size = $4000,  fill = yes, file = %O;
    PRG:   start = $C000, size = $4000,  fill = yes, file = %O;
    REST:  start = $8000, size = $38000, fill = yes, file = %O;
}
SEGMENTS {
    HEADER:   load = HDR,  type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    CODE:     load = PRG,  type = ro, start = $C000;
    VECTORS:  load = PRG,  type = ro, start = $FFFA;
}
