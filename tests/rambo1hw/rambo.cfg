# Linker layout for the RAMBO-1 test ROMs: iNES2 header, 31 data banks, fixed bank, vectors.
# PRG = 31 x 8 KiB data banks (banks.bin, identity blocks) + the fixed 8 KiB bank ($1F). CHR is appended by the Makefile.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0200, size = $0100, type = rw;
    HDR:    start = $0000, size = $0010, file = %O, fill = yes;
    BANKS:  start = $0000, size = $3E000, file = %O, fill = yes;
    FIXED:  start = $E000, size = $1FFA, file = %O, fill = yes, fillval = $EA;
    VEC:    start = $FFFA, size = $0006, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = RAM,   type = bss;
    HEADER:   load = HDR,   type = ro;
    BANKS:    load = BANKS, type = ro;
    IDENT:    load = FIXED, type = ro;
    CODE:     load = FIXED, type = ro;
    ALIGNED:  load = FIXED, type = ro, align = $100, optional = yes;
    RODATA:   load = FIXED, type = ro;
    VECTORS:  load = VEC,   type = ro;
}
