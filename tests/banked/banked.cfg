MEMORY {
    HDR:   start = $0000, size = $0010, file = %O, fill = yes;
    ZP:    start = $0010, size = $00F0, type = rw;
    SRAM:  start = $6000, size = $2000, type = rw;
    PRG0:  start = $8000, size = $4000, file = %O, fill = yes;
    PRG1:  start = $8000, size = $4000, file = %O, fill = yes;
    PRG2:  start = $8000, size = $4000, file = %O, fill = yes;
    PRG3:  start = $C000, size = $4000, file = %O, fill = yes;
    CHR:   start = $0000, size = $2000, file = %O, fill = yes;
}
SEGMENTS {
    HEADER:   load = HDR,  type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    SRAM:     load = SRAM, type = bss;
    BANK0:    load = PRG0, type = ro;
    BANK1:    load = PRG1, type = ro;
    BANK2:    load = PRG2, type = ro;
    FIXED:    load = PRG3, type = ro;
    VECTORS:  load = PRG3, type = ro, start = $FFFA;
    CHR:      load = CHR,  type = ro;
}
