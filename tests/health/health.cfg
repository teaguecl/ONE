MEMORY {
    HDR:  start = $0000, size = $0010, fill = yes, file = %O;
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    B0:   start = $8000, size = $4000, fill = yes, fillval = $00, file = %O;
    B1:   start = $8000, size = $4000, fill = yes, fillval = $00, file = %O;
    B2:   start = $8000, size = $4000, fill = yes, fillval = $00, file = %O;
    B3:   start = $C000, size = $4000, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp;
    BANK0:    load = B0,  type = ro;
    BANK1:    load = B1,  type = ro;
    BANK2:    load = B2,  type = ro;
    FIXED:    load = B3,  type = ro;
    VECTORS:  load = B3,  type = ro, start = $FFFA;
}
