MEMORY {
    HDR:   start = $0000, size = $0010,  fill = yes, file = %O;
    ZP:    start = $0000, size = $0100,  type = rw, file = "";
    BANKS: start = $8000, size = $6000,  fill = yes, file = %O;
    PRG:   start = $E000, size = $2000,  fill = yes, file = %O;
    CHR:   start = $0000, size = $2000,  fill = yes, file = %O;
}
SEGMENTS {
    HEADER:   load = HDR,   type = ro;
    ZEROPAGE: load = ZP,    type = zp;
    PRGBANKS: load = BANKS, type = ro;
    CODE:     load = PRG,   type = ro, start = $E000;
    VECTORS:  load = PRG,   type = ro, start = $FFFA;
    CHR:      load = CHR,   type = ro;
}
